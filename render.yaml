# One-click deploy on Render (free plan): Dashboard → New → Blueprint → pick this repo.
# Works with zero config (embedded MongoDB, data resets on restart). For permanent data set MONGODB_URI
# to a free MongoDB Atlas connection string.
services:
  - type: web
    name: codecrack
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/auth/providers
    autoDeploy: true
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: FIRST_USER_ADMIN
        value: "false"
      - key: ADMIN_EMAILS
        sync: false
      - key: ENABLED_LANGUAGES
        value: python
      - key: RUNNER_CONCURRENCY
        value: "1"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
